<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kavya & Vineeth Engagement</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;600&family=Lora&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    font-family: 'Lora', serif;
    display: flex;
    justify-content: center;
    align-items: center;

    /* FIXED BACKGROUND */
    background: url('bg.png') no-repeat center center;
    background-size: contain;
    background-color: #ffffff; /* fallback for empty space */
}

/* Content aligned to center circle */
.container {
    text-align: center;
    max-width: 500px;
    width: 90%;
    animation: fadeIn 1.5s ease;
}

/* Header */
.top-text {
    font-family: 'Cinzel', serif;
    letter-spacing: 2px;
    font-size: 14px;
    margin-bottom: 20px;
}

/* Names */
.names {
    font-family: 'Great Vibes', cursive;
    font-size: 60px;
    color: #5d4037;
    margin: 15px 0;
    animation: scaleIn 1.2s ease;
}

.names span {
    display: block;
    font-size: 28px;
}

/* Invite text */
.invite {
    margin: 20px 0;
    font-size: 14px;
}

/* Date */
.month {
    font-family: 'Cinzel', serif;
    letter-spacing: 3px;
}

.big-date {
    font-size: 50px;
    font-family: 'Cinzel', serif;
    margin: 10px 0;
}

.time {
    font-family: 'Cinzel', serif;
    font-size: 14px;
}

/* Venue */
.venue {
    margin-top: 20px;
    font-size: 14px;
}

/* Countdown */
.countdown {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

.unit span {
    font-size: 20px;
    font-weight: bold;
}

.unit label {
    font-size: 10px;
}

/* Button */
.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background: #b38b4d;
    color: white;
    text-decoration: none;
    font-family: 'Cinzel', serif;
    transition: 0.3s;
}

.btn:hover {
    background: #5d4037;
}

/* Map */
iframe {
    margin-top: 20px;
    width: 100%;
    height: 200px;
    border: none;
}

/* Animations */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

@keyframes scaleIn {
    from {transform: scale(0.8); opacity: 0;}
    to {transform: scale(1); opacity: 1;}
}

</style>
</head>

<body>

<div class="container">

    <div class="top-text">TOGETHER WITH THEIR FAMILIES</div>

    <div class="names">
        Kavya
        <span>&</span>
        Vineeth
    </div>

    <div class="invite">
        invite you to join their engagement celebration
    </div>

    <div class="month">MAY</div>
    <div class="big-date">13</div>
    <div class="time">WEDNESDAY AT 9:45 AM</div>
    <div class="month">2026</div>

    <div class="venue">
        <b>SANJO AUDITORIUM</b><br>
        Chunangamvely, Aluva
    </div>

    <div class="countdown">
        <div class="unit"><span id="days">00</span><label>Days</label></div>
        <div class="unit"><span id="hours">00</span><label>Hrs</label></div>
        <div class="unit"><span id="mins">00</span><label>Min</label></div>
        <div class="unit"><span id="secs">00</span><label>Sec</label></div>
    </div>

    <a href="https://www.google.com/maps/dir/?api=1&destination=10.089611,76.381500" target="_blank" class="btn">
        Get Directions
    </a>

    <iframe src="https://www.google.com/maps?q=10.089611,76.381500&output=embed"></iframe>

</div>

<script>
const target = new Date("May 13, 2026 09:45:00").getTime();

function updateTimer() {
    const now = new Date().getTime();
    const diff = target - now;

    if (diff <= 0) return;

    document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
    document.getElementById("hours").innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
    document.getElementById("mins").innerText = Math.floor((diff / (1000 * 60)) % 60);
    document.getElementById("secs").innerText = Math.floor((diff / 1000) % 60);
}

setInterval(updateTimer, 1000);
updateTimer();
</script>

</body>
</html>
