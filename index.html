<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kavya & Vineeth - Engagement</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #9ad4cd;
            --primary-dark: #5c9792;
            --accent: #f8c8dc; 
            --bg-color: #f6f9f9;
            --surface: #ffffff;
            --text-dark: #374a44;
            --text-muted: #82988e;
            --font-main: 'Poppins', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body, html {
            width: 100%;
            font-family: var(--font-main);
            color: var(--text-dark);
            overflow-x: hidden;
            background-color: var(--bg-color);
            -webkit-font-smoothing: antialiased;
        }

        /* --- BACKGROUND & CONTENT --- */
        .animated-bg {
            position: fixed;
            top: 0; left: 0; 
            width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #e4eff0 0%, #fcf5f7 100%);
            z-index: -1;
        }

        .main-wrapper {
            min-height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px; 
            position: relative;
        }

        .content-card {
            width: 100%;
            max-width: 440px;
            text-align: center;
            padding: 45px 30px;
            background: var(--surface);
            border-radius: 28px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.02);
            position: relative;
            border: 1px solid rgba(255,255,255,0.5); /* Soft glass effect */
        }

        .animate-text {
            opacity: 0;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .delay-0 { animation-delay: 0.2s; }
        .delay-1 { animation-delay: 0.4s; }
        .delay-2 { animation-delay: 0.6s; }
        .delay-3 { animation-delay: 0.8s; }
        .delay-4 { animation-delay: 1.0s; }
        .delay-5 { animation-delay: 1.2s; }
        .delay-6 { animation-delay: 1.4s; }
        .delay-7 { animation-delay: 1.6s; }

        .names-container {
            width: 100%;
            padding: 10px 5px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 5px;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(40px, 10vw, 46px); 
            line-height: 1.2; 
            color: var(--primary-dark);
            display: inline-block;
            padding: 5px 0;
        }

        .rings-icon {
            width: 32px;
            height: auto;
            display: inline-block;
            vertical-align: middle;
            opacity: 0.7;
        }

        .header-text { 
            font-family: var(--font-main); 
            letter-spacing: 1.5px; 
            font-size: 0.7rem; 
            color: var(--text-muted); 
            font-weight: 500; 
            text-transform: uppercase;
        }
        .invite-msg { 
            font-size: 0.85rem; 
            margin: 15px 0 20px; 
            color: var(--text-muted); 
            line-height: 1.6; 
            font-weight: 400;
        }

        .month-year { 
            letter-spacing: 2.5px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            color: var(--primary-dark); 
            text-transform: uppercase;
        }
        .date-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin: 12px 0 16px; 
        }
        .big-date { 
            font-size: 3rem; 
            color: var(--primary-dark); 
            font-weight: 600; 
            line-height: 1; 
            border-left: 2px solid rgba(0,0,0,0.04);
            border-right: 2px solid rgba(0,0,0,0.04);
            padding: 0 22px;
        }
        .time-info { 
            font-size: 0.65rem; 
            font-weight: 600; 
            color: var(--text-muted); 
            width: 80px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .venue { 
            font-size: 0.85rem; 
            line-height: 1.6; 
            color: var(--text-dark); 
            margin: 25px 0; 
        }
        .venue b { 
            display: block; 
            font-size: 0.95rem; 
            margin-bottom: 6px; 
            font-weight: 600;
            color: var(--primary-dark);
            letter-spacing: 0.5px;
        }

        .countdown { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            margin-bottom: 30px; 
        }
        .unit { 
            background: var(--bg-color); 
            padding: 12px 8px; 
            min-width: 62px; 
            border-radius: 16px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.015);
            transition: transform 0.3s ease;
        }
        .unit:hover {
            transform: translateY(-2px);
        }
        .unit span { 
            font-size: 1.3rem; 
            font-weight: 600; 
            color: var(--primary-dark); 
            display: block; 
            margin-bottom: 2px;
        }
        .unit label { 
            font-size: 0.55rem; 
            text-transform: uppercase; 
            color: var(--text-muted); 
            letter-spacing: 1px; 
            font-weight: 500;
        }

        .btn-box { margin-bottom: 20px; }
        .btn {
            background: var(--primary-dark);
            color: #ffffff;
            padding: 15px 32px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            border-radius: 30px;
            display: inline-block;
            transition: all 0.3s ease;
            box-shadow: 0 6px 16px rgba(92, 151, 146, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #4a807a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(92, 151, 146, 0.5);
        }

        .map-container {
            width: 100%;
            height: 160px; 
            border-radius: 20px;
            overflow: hidden;
            margin-top: 10px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
            border: 1px solid #ebf2f2;
        }
        iframe { width: 100%; height: 100%; border: none; }

        @media (max-width: 380px) {
            .names { font-size: 32px; }
            .content-card { padding: 35px 20px; }
            .big-date { font-size: 2.4rem; padding: 0 15px; }
            .unit { min-width: 54px; padding: 10px 5px; }
            .map-container { height: 130px; }
        }
    </style>
</head>
<body>



    <div class="animated-bg"></div>

    <div class="main-wrapper">
        <main class="content-card">
            
            <div class="animate-text">
                <!-- <div class="om">
                    <img src="ganesha.png" alt="Ganesha" class="ganesha-icon">
                </div> -->
                <p class="header-text">Together with their families</p>
            </div>

            <div class="animate-text delay-0">
                <div class="names-container">
                    <h1 class="names">Kavya</h1>
                    <img src="rings.png" alt="Rings" class="rings-icon">
                    <h1 class="names">Vineeth</h1>
                </div>
            </div>

            <div class="animate-text delay-1">
                <p class="invite-msg">cordially invite you to join them<br>at their engagement ceremony on</p>
            </div>

            <div class="animate-text delay-2">
                <div class="month-year">MAY 2026</div>
                <div class="date-row">
                    <div class="time-info">WEDNESDAY</div>
                    <div class="big-date">13</div>
                    <div class="time-info">9:45 AM</div>
                </div>
            </div>

            <div class="venue animate-text delay-3">
                <b>AT SANJO AUDITORIUM</b>
                Opp. St. Joseph’s Church,<br>
                Chunangamvely, Aluva
            </div>

            <div id="countdown" class="countdown animate-text delay-4">
                <div class="unit"><span id="days">00</span><label>Days</label></div>
                <div class="unit"><span id="hours">00</span><label>Hrs</label></div>
                <div class="unit"><span id="mins">00</span><label>Min</label></div>
                <div class="unit"><span id="secs">00</span><label>Sec</label></div>
            </div>

            <div class="btn-box animate-text delay-5">
                <a href="https://www.google.com/maps/dir/?api=1&destination=10.0897177,76.381047" target="_blank" class="btn">Get Directions</a>
            </div>

            <div class="animate-text delay-6">
                <div class="map-container">
                    <iframe src="https://maps.google.com/maps?q=10.0897177,76.381047&hl=en&z=17&output=embed" 
                    allowfullscreen="" 
                    loading="lazy"></iframe>
                </div>
            </div>
            
        </main>
    </div>

    <script>


        const targetDate = new Date("May 13, 2026 09:45:00").getTime();

        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff < 0) {
                document.getElementById("countdown").innerHTML = "<b style='color:var(--bottle-green)'>HAPPENING NOW!</b>";
                return;
            }

            const d = Math.floor(diff / (1000 * 60 * 60 * 24));
            const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = d.toString().padStart(2, '0');
            document.getElementById("hours").innerText = h.toString().padStart(2, '0');
            document.getElementById("mins").innerText = m.toString().padStart(2, '0');
            document.getElementById("secs").innerText = s.toString().padStart(2, '0');
        }
        
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
