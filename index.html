<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kavya & Vineeth Engagement</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@400;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bottle-green: #00332a;
            --forest-green: #014d40;
            --royal-gold: #d4af37;
            --cream-bg: rgba(255, 253, 240, 0.95);
        }

        /* Prevent all scrolling */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            position: fixed; 
        }

        body {
            font-family: 'Lora', serif;
            background-color: #fdf5e6;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
        }

        /* Main Container: Forced to 100% of the screen height */
        .main-wrapper {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            z-index: 5;
        }

        .content-card {
            height: 96%; /* Leave a small gap around edges */
            width: 100%;
            max-width: 500px;
            background: var(--cream-bg);
            border: 2px solid var(--royal-gold);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* Evenly spaces items to fill height */
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 34, 28, 0.3);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* --- TEXT ANIMATIONS --- */
        .animate { opacity: 0; transform: translateY(10px); animation: fadeUp 0.8s forwards; }
        .delay-1 { animation-delay: 0.3s; }
        .delay-2 { animation-delay: 0.6s; }
        .delay-3 { animation-delay: 0.9s; }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .om { font-size: 30px; color: var(--bottle-green); }

        .header-text { 
            font-family: 'Cinzel', serif; 
            font-size: 11px; 
            letter-spacing: 2px; 
            color: var(--forest-green); 
        }

        /* FIXED: No clipping for cursive names */
        .names-container {
            width: 100%;
            padding: 10px 0;
            overflow: visible;
        }

        .names {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(45px, 11vw, 65px);
            line-height: 1.4;
            padding: 0 20px;
            background: linear-gradient(45deg, var(--bottle-green), var(--royal-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.03); } }

        .ampersand { font-size: 24px; color: var(--royal-gold); display: block; margin: -5px 0; }

        .invite-msg { font-size: 14px; font-style: italic; color: var(--bottle-green); line-height: 1.4; }

        /* Compact Date Section */
        .date-box { width: 100%; }
        .month { font-family: 'Cinzel', serif; font-size: 16px; font-weight: bold; letter-spacing: 4px; color: var(--bottle-green); }
        .date-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 5px 0; }
        .line { height: 1px; background: var(--royal-gold); flex: 1; max-width: 40px; }
        .big-date { font-family: 'Cinzel', serif; font-size: 40px; font-weight: bold; padding: 0 15px; border-left: 2px solid var(--royal-gold); border-right: 2px solid var(--royal-gold); color: var(--bottle-green); }
        .time { font-family: 'Cinzel', serif; font-size: 12px; font-weight: bold; color: var(--forest-green); }

        .venue { font-size: 13px; color: var(--text-dark); line-height: 1.3; }
        .venue b { font-family: 'Cinzel', serif; font-size: 16px; color: var(--bottle-green); display: block; margin-bottom: 3px; }

        /* Compact Countdown */
        .countdown { display: flex; gap: 8px; }
        .unit { background: var(--bottle-green); padding: 8px; min-width: 55px; border-radius: 10px; border: 1px solid var(--royal-gold); }
        .unit span { font-size: 18px; font-weight: bold; color: var(--royal-gold); display: block; }
        .unit label { font-size: 8px; text-transform: uppercase; color: #fff; opacity: 0.8; }

        .btn {
            background: var(--bottle-green);
            color: var(--royal-gold);
            padding: 10px 25px;
            text-decoration: none;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid var(--royal-gold);
            border-radius: 5px;
            transition: 0.3s;
        }

        /* Map scaled to fit remaining space */
        .map-container {
            width: 100%;
            height: 20%; /* Dynamically takes up 20% of the card height */
            min-height: 120px;
            border: 2px solid var(--royal-gold);
            border-radius: 10px;
            overflow: hidden;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="content-card">
            
            <div class="animate om">ॐ</div>

            <div class="animate delay-1">
                <p class="header-text">Together with their families</p>
                <div class="names-container">
                    <h1 class="names">Kavya <span class="ampersand">&</span> Vineeth</h1>
                </div>
            </div>

            <div class="animate delay-2">
                <p class="invite-msg">cordially invite you to the<br>engagement ceremony of</p>
                
                <div class="date-box">
                    <div class="month">MAY 2026</div>
                    <div class="date-row">
                        <div class="line"></div>
                        <div class="time">WED</div>
                        <div class="big-date">13</div>
                        <div class="time">9:45 AM</div>
                        <div class="line"></div>
                    </div>
                </div>
            </div>

            <div class="animate delay-3">
                <div class="venue">
                    <b>SANJO AUDITORIUM</b>
                    Chunangamvely, Aluva
                </div>

                <div class="countdown">
                    <div class="unit"><span id="days">00</span><label>Days</label></div>
                    <div class="unit"><span id="hours">00</span><label>Hrs</label></div>
                    <div class="unit"><span id="mins">00</span><label>Min</label></div>
                    <div class="unit"><span id="secs">00</span><label>Sec</label></div>
                </div>

                <div style="margin-top: 10px;">
                    <a href="https://www.google.com/maps/dir/?api=1&destination=10.0894368,76.3809619" target="_blank" class="btn">Directions</a>
                </div>
            </div>

            <div class="map-container animate delay-3">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3928.3475!2d76.3809619!3d10.0894368!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMTDCsDA1JzIyLjAiTiA3NsKwMjInNTEuNSJF!5e0!3m2!1sen!2sin!4v1640000000000"></iframe>
            </div>

        </div>
    </div>

    <script>
        const target = new Date("May 13, 2026 09:45:00").getTime();
        function updateTimer() {
            const now = new Date().getTime();
            const diff = target - now;
            if (diff < 0) return;
            document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24)).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
            document.getElementById("mins").innerText = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
            document.getElementById("secs").innerText = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
